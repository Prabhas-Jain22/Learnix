services:
  - name: learnix-backend
    type: web
    env: node
    region: oregon
    branch: main
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        value: your-mongo-uri
      - key: JWT_SECRET
        value: your-jwt-secret
      - key: EMAIL_USER
        value: your-email@example.com
      - key: EMAIL_PASSWORD
        value: your-email-password
      - key: EMAIL_SERVICE
        value: gmail
      - key: GEMINI_API_KEY
        value: your-gemini-api-key
      - key: FRONTEND_URL
        value: https://your-frontend-url.onrender.com

staticSites:
  - name: learnix-frontend
    branch: main
    env: node
    rootDir: Frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://your-backend-url.onrender.com
